apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-books
  labels:
    {{- include "calibre-web.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.books.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.books.size }}